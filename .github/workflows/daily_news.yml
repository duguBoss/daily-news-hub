name: 每日全球新闻自动化生成

on:
  schedule:
    - cron: '0 0 * * *' # UTC 0点执行，即北京时间早上8点
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests pytz

      - name: Run News Aggregator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python aggregate_news.py

      - name: Commit and Push generated file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 注意：这里改成了提交 *.json 文件
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 auto-generate daily global news JSON" && git push)
