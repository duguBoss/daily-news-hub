name: 每日全球新闻自动化生成

# 触发条件
on:
  schedule:
    # 每天 UTC 时间 00:00 执行 (即北京时间每天早上 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在 GitHub 网页上随时手动点击运行测试

# 任务流程
jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 Action 推送代码到仓库的权限

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装所需的第三方库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-generativeai pytz

      # 4. 运行 Python 聚合脚本
      - name: Run News Aggregator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python aggregate_news.py

      # 5. 将生成的文件提交并推送到 GitHub 仓库
      - name: Commit and Push generated file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.md
          # 如果没有文件变化则跳过，有变化则提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 auto-generate daily global news" && git push)
